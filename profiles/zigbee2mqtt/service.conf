[Service]
Environment=CERT_PATH=@SERVICE_HOME@/zigbee2mqtt/data/certs/client.crt
Environment=KEY_PATH=@SERVICE_HOME@/zigbee2mqtt/data/certs/client.key
ExecStartPost=/bin/chown @SERVICE_USER@:@SERVICE_USER@ @SERVICE_HOME@/zigbee2mqtt/data/certs/client.crt @SERVICE_HOME@/zigbee2mqtt/data/certs/client.key
ExecStartPost=/bin/chmod 0600 @SERVICE_HOME@/zigbee2mqtt/data/certs/client.crt @SERVICE_HOME@/zigbee2mqtt/data/certs/client.key
ExecStartPost=/usr/bin/systemctl restart zigbee2mqtt.service
