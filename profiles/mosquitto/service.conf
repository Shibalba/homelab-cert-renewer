[Service]
Environment=CERT_PATH=/etc/mosquitto/certs/mosquitto.crt
Environment=KEY_PATH=/etc/mosquitto/certs/mosquitto.key
ExecStartPost=/bin/chown mosquitto:mosquitto /etc/mosquitto/certs/mosquitto.crt /etc/mosquitto/certs/mosquitto.key
ExecStartPost=/bin/chmod 0640 /etc/mosquitto/certs/mosquitto.crt /etc/mosquitto/certs/mosquitto.key
ExecStartPost=/usr/bin/systemctl reload mosquitto.service
