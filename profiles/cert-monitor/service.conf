[Service]
Environment=CERT_PATH=/etc/mosquitto/certs/cert_monitor.crt
Environment=KEY_PATH=/etc/mosquitto/certs/cert_monitor.key
ExecStartPost=/bin/chown @SERVICE_USER@:@SERVICE_USER@ /etc/mosquitto/certs/cert_monitor.crt /etc/mosquitto/certs/cert_monitor.key
ExecStartPost=/bin/chmod 0600 /etc/mosquitto/certs/cert_monitor.crt /etc/mosquitto/certs/cert_monitor.key
ExecStartPost=/usr/bin/systemctl try-reload-or-restart cert-monitor@@SERVICE_USER@.service
