[Service]
Environment=CERT_PATH=/etc/mosquitto/certs/rpi_stats.crt
Environment=KEY_PATH=/etc/mosquitto/certs/rpi_stats.key
ExecStartPost=/bin/chown @SERVICE_USER@:@SERVICE_USER@ /etc/mosquitto/certs/rpi_stats.crt /etc/mosquitto/certs/rpi_stats.key
ExecStartPost=/bin/chmod 0600 /etc/mosquitto/certs/rpi_stats.crt /etc/mosquitto/certs/rpi_stats.key
ExecStartPost=/usr/bin/systemctl try-reload-or-restart rpi_stats_daemon@@SERVICE_USER@.service
